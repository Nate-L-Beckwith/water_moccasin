# Base compose for water_moccasin: play mode on a Linux host with X11 +
# PulseAudio. `python wm.py start` is the recommended launcher because it
# probes the host (WSLg paths, /dev/dri, controller devices, uinput) and only
# mounts what exists; compose cannot do that. If you use compose directly:
#   - controllers: add a docker-compose.override.yml with `devices:` entries
#     for the paths in CONTROLLER_DEVICES (.env)
#   - WSLg: set PULSE_SOCKET=/mnt/wslg/PulseServer and
#     X11_SOCKET_DIR=/mnt/wslg/.X11-unix in .env
#   - streaming: docker compose -f docker-compose.yml -f docker-compose.stream.yml up
services:
  dolphin:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        INPUT_GID: "${INPUT_GID:-104}"
        WITH_SUNSHINE: "${WITH_SUNSHINE:-1}"
    image: "${IMAGE_NAME:-water-moccasin/dolphin}:${IMAGE_TAG:-latest}"
    container_name: "${CONTAINER_NAME:-water-moccasin}"
    network_mode: host
    mem_limit: "${MEM_LIMIT:-2g}"
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      PULSE_SERVER: "unix:${PULSE_SOCKET:-/run/user/${UID:-1000}/pulse/native}"
      DOLPHIN_MODE: "${DOLPHIN_MODE:-play}"
      NETPLAY_PORT: "${NETPLAY_PORT:-2626}"
      NETPLAY_GAME: "${NETPLAY_GAME:-}"
    volumes:
      - ./game:/game:ro
      - ./saves:/saves
      - ./logs:/logs
      - ./controller_configs:/controller_configs:ro
      - "${X11_SOCKET_DIR:-/tmp/.X11-unix}:/tmp/.X11-unix"
      - /dev/shm:/dev/shm
      - /etc/machine-id:/etc/machine-id:ro
      - "${PULSE_SOCKET:-/run/user/${UID:-1000}/pulse/native}:${PULSE_SOCKET:-/run/user/${UID:-1000}/pulse/native}"
    devices:
      # Remove this line on hosts without a GPU node; docker fails hard otherwise.
      - /dev/dri:/dev/dri
    cap_add:
      - SYS_NICE
    group_add:
      - "${INPUT_GID:-104}"
    restart: "no"
    stdin_open: true
    tty: true
